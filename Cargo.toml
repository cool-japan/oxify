[workspace]
members = [
    "crates/oxify",
    "crates/oxify-api",
    "crates/oxify-authn",
    "crates/oxify-authz",
    "crates/oxify-cli",
    "crates/oxify-connect-comm",
    "crates/oxify-connect-data",
    "crates/oxify-connect-db",
    "crates/oxify-connect-graphql",
    "crates/oxify-connect-llm",
    "crates/oxify-connect-storage",
    "crates/oxify-connect-vector",
    "crates/oxify-connect-vision",
    "crates/oxify-engine",
    "crates/oxify-mcp",
    "crates/oxify-model",
    "crates/oxify-server",
    "crates/oxify-storage",
    "crates/oxify-ui",
    "crates/oxify-vector",
]
exclude = [
    "examples/*",
]
resolver = "2"

[patch.crates-io]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["OxiFY Contributors"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxify"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.50.0", features = ["full"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
thiserror = "2.0.18"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }

# Web framework
axum = { version = "0.8.8", features = ["macros", "ws"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
hyper = { version = "1.8", features = ["full"] }

# GraphQL
async-graphql = { version = "7.2", features = ["chrono"] }
async-graphql-axum = "7.2"

# LLM & Vector DB clients
reqwest = { version = "0.13.2", features = ["json", "stream", "form", "query"] }
qdrant-client = "1.17.0"
sqlx = { version = "0.9.0-alpha.1", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# Utilities
clap = { version = "4.6.0", features = ["derive"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
cron = "0.16"
rand = "0.10"
rayon = "1.11"
num_cpus = "1.17"
toml = "1.1"
dirs = "6.0"

# Code execution
rhai = { version = "1.24", features = ["sync"] }
wasmer = "7.1"

# OpenTelemetry
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "grpc-tonic"] }
opentelemetry-semantic-conventions = "0.31"
tracing-opentelemetry = "0.32"

# Event-driven / messaging
async-nats = "0.38"
rdkafka = { version = "0.39", default-features = false, features = ["tokio"] }
lapin = "4.3.0"

# GitHub API
octocrab = "0.49"

# Cryptography (AWS SigV4, etc.)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# JWT / auth tokens
jsonwebtoken = "9.3"

# Communications
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# Document database
mongodb = "3.7.0"

# Object storage
object_store = { version = "0.11", default-features = false, features = ["aws", "gcp", "azure"] }
bytes = "1.10"

# Compression (Pure Rust, OxiARC ecosystem)
oxiarc-deflate = "0.3.3"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Testing & Benchmarking
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.27"
proptest = "1.11"
wiremock = "0.6"
