<!-- Template gallery grid partial (HTMX, no layout wrapper) -->
<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" role="list" aria-label="Available workflow templates">
  {% for tmpl in templates %}
  <article class="bg-white dark:bg-gray-800 rounded-lg shadow hover:shadow-md transition-shadow border border-gray-200 dark:border-gray-700 flex flex-col"
           role="listitem">
    <div class="p-5 flex-1">
      <!-- Header row: name + category badge -->
      <div class="flex items-start justify-between gap-3">
        <h3 class="text-sm font-semibold text-gray-900 dark:text-white">{{ tmpl.name }}</h3>
        <span class="inline-flex flex-shrink-0 items-center rounded-full px-2 py-0.5 text-xs font-medium
          {% if tmpl.category == "Language" %}bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-200
          {% else if tmpl.category == "Retrieval" %}bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-200
          {% else if tmpl.category == "Data" %}bg-yellow-100 text-yellow-700 dark:bg-yellow-900 dark:text-yellow-200
          {% else if tmpl.category == "Integration" %}bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-200
          {% else if tmpl.category == "Vision" %}bg-pink-100 text-pink-700 dark:bg-pink-900 dark:text-pink-200
          {% else %}bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200{% endif %}">
          {{ tmpl.category }}
        </span>
      </div>

      <!-- Description -->
      <p class="mt-2 text-sm text-gray-500 dark:text-gray-400 line-clamp-3">{{ tmpl.description }}</p>

      <!-- Parameter count -->
      <div class="mt-3 flex items-center gap-1 text-xs text-gray-400 dark:text-gray-500">
        <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        {{ tmpl.parameters.len() }} parameter{% if tmpl.parameters.len() != 1 %}s{% endif %}
      </div>
    </div>

    <!-- Action buttons -->
    <div class="px-5 pb-5 pt-0 flex items-center gap-3">
      <a href="/workflows/new?template={{ tmpl.id }}"
         class="flex-1 inline-flex justify-center items-center rounded-md bg-primary-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 transition-colors"
         aria-label="Use the {{ tmpl.name }} template to create a new workflow">
        Use Template
      </a>
      <button type="button"
              hx-get="/htmx/templates/{{ tmpl.id }}"
              hx-target="#template-detail-content"
              hx-swap="innerHTML"
              onclick="document.getElementById('template-detail-panel').classList.remove('hidden')"
              class="inline-flex items-center rounded-md bg-white dark:bg-gray-700 px-3 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600 transition-colors"
              aria-label="View parameters for {{ tmpl.name }}">
        Details
      </button>
    </div>
  </article>
  {% endfor %}

  {% if templates.is_empty() %}
  <div class="col-span-3 py-16 text-center text-gray-500 dark:text-gray-400" role="status">
    <svg class="mx-auto h-12 w-12 text-gray-300 dark:text-gray-600" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
    </svg>
    <p class="mt-2 text-sm">No templates available</p>
  </div>
  {% endif %}
</div>
