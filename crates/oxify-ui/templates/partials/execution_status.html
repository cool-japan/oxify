<div class="flex items-center gap-4">
  <div class="flex-1">
    <div class="flex justify-between text-sm mb-1">
      <span class="font-medium text-gray-900 dark:text-white">{{ execution_id }}</span>
      <span class="text-gray-500 dark:text-gray-400">{{ progress }}%</span>
    </div>
    <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
      <div class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: {{ progress }}%"></div>
    </div>
  </div>
  <span class="px-2 py-1 text-xs font-medium rounded-full {% if status == "running" %}bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200{% else if status == "completed" %}bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200{% else if status == "failed" %}bg-red-100 text-red-800 dark:bg-red-900 dark:text-red-200{% else %}bg-yellow-100 text-yellow-800 dark:bg-yellow-900 dark:text-yellow-200{% endif %}">{{ status }}</span>
</div>
{% if current_node.is_some() %}
<div class="mt-2 text-sm text-gray-500 dark:text-gray-400">
  Current node: <code class="px-1 bg-gray-100 dark:bg-gray-800 rounded">{{ current_node.as_ref().unwrap() }}</code>
</div>
{% endif %}
<div class="mt-1 text-xs text-gray-400 dark:text-gray-500">
  Elapsed: {{ elapsed_time }}
</div>
