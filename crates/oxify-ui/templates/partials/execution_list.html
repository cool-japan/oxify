<!-- Execution list table -->
<table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
  <thead class="bg-gray-50 dark:bg-gray-900">
    <tr>
      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">ID</th>
      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Workflow</th>
      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Status</th>
      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Started</th>
      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Duration</th>
      <th scope="col" class="relative px-6 py-3"><span class="sr-only">Actions</span></th>
    </tr>
  </thead>
  <tbody id="execution-rows" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
    {% for execution in executions %}
    <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50">
      <td class="px-6 py-4 whitespace-nowrap">
        <a href="/executions/{{ execution.id }}" class="text-primary-600 dark:text-primary-400 hover:underline font-mono text-sm">{{ execution.short_id }}</a>
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 dark:text-white">{{ execution.workflow_name }}</td>
      <td class="px-6 py-4 whitespace-nowrap">
        <span class="px-2 py-1 text-xs font-medium rounded-full {{ execution.status_class }}">{{ execution.status }}</span>
      </td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">{{ execution.started_at }}</td>
      <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">{{ execution.duration }}</td>
      <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
        <a href="/executions/{{ execution.id }}" class="text-primary-600 dark:text-primary-400 hover:text-primary-900 dark:hover:text-primary-300">View</a>
      </td>
    </tr>
    {% endfor %}
    {% if has_more %}
    <tr id="load-more-trigger">
      <td colspan="6" class="px-6 py-4 text-center">
        <div hx-get="/htmx/executions/rows?page={{ next_page }}{% if !status.is_empty() %}&status={{ status }}{% endif %}{% if !workflow_id.is_empty() %}&workflow_id={{ workflow_id }}{% endif %}"
             hx-trigger="revealed"
             hx-swap="afterend"
             hx-target="#load-more-trigger"
             class="text-sm text-gray-500 dark:text-gray-400">
          <svg class="animate-spin h-5 w-5 mx-auto text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
      </td>
    </tr>
    {% endif %}
  </tbody>
</table>
