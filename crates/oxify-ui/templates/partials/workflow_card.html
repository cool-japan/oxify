<div class="bg-white dark:bg-gray-800 rounded-lg shadow hover:shadow-md transition-shadow" id="workflow-{{ id }}">
  <div class="p-4">
    <div class="flex items-start justify-between">
      <div class="flex-1 min-w-0">
        <a href="/workflows/{{ id }}" class="block">
          <h3 class="text-sm font-medium text-gray-900 dark:text-white truncate hover:text-primary-600">{{ name }}</h3>
        </a>
        {% if description.is_some() %}
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400 line-clamp-2">{{ description.as_ref().unwrap() }}</p>
        {% endif %}
      </div>
      <div class="ml-4 flex-shrink-0 flex items-center gap-2">
        <span class="px-2 py-1 text-xs font-medium rounded-full {% if status == "active" %}bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200{% else %}bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-200{% endif %}">{{ status }}</span>
        <div x-data="{ open: false }" class="relative">
          <button @click="open = !open" class="p-1 rounded-md text-gray-400 hover:text-gray-500 dark:hover:text-gray-300">
            <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM10 8.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM11.5 15.5a1.5 1.5 0 10-3 0 1.5 1.5 0 003 0z" />
            </svg>
          </button>
          <div x-show="open" @click.outside="open = false" class="absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white dark:bg-gray-700 py-1 shadow-lg ring-1 ring-black ring-opacity-5" x-cloak>
            <a href="/workflows/{{ id }}/edit" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-600">Edit</a>
            <a href="/workflows/{{ id }}" class="block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-600">View Details</a>
            <button type="button" class="block w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-100 dark:hover:bg-gray-600" hx-delete="/htmx/workflows/{{ id }}" hx-target="#workflow-{{ id }}" hx-swap="outerHTML" hx-confirm="Are you sure you want to delete this workflow?">Delete</button>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-4 flex items-center gap-4 text-xs text-gray-500 dark:text-gray-400">
      <span class="flex items-center gap-1">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" />
        </svg>
        {{ node_count }} nodes
      </span>
      {% if last_run.is_some() %}
      <span class="flex items-center gap-1">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ last_run.as_ref().unwrap() }}
      </span>
      {% endif %}
    </div>
  </div>
</div>
