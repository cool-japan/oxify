{% extends "layouts/base.html" %}

{% block title %}{{ title }} - OxiFY{% endblock %}

{% block content %}
<div class="space-y-6" role="main" aria-labelledby="workflows-heading">
  <!-- Header -->
  <div class="sm:flex sm:items-center sm:justify-between">
    <div>
      <h1 id="workflows-heading" class="text-2xl font-bold text-gray-900 dark:text-white">Workflows</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Manage your workflow definitions</p>
    </div>
    <div class="mt-4 sm:mt-0 flex items-center gap-3">
      <!-- Import -->
      <label class="inline-flex items-center rounded-md bg-white dark:bg-gray-800 px-3 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer"
             aria-label="Import workflows from JSON or YAML">
        <svg class="-ml-0.5 mr-1.5 h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M3 16.5v-13A1.5 1.5 0 014.5 2h7.379a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 01.44 1.061V16.5A1.5 1.5 0 0114 18H4.5A1.5 1.5 0 013 16.5zm4.5-9a.75.75 0 01.75.75v4.19l1.22-1.22a.75.75 0 111.06 1.06l-2.5 2.5a.75.75 0 01-1.06 0l-2.5-2.5a.75.75 0 011.06-1.06l1.22 1.22V8.25A.75.75 0 017.5 7.5z" clip-rule="evenodd" />
        </svg>
        Import JSON
        <input type="file"
               accept=".json,.yaml,.yml"
               class="sr-only"
               aria-label="Select file to import"
               hx-post="/api/workflows/import"
               hx-encoding="multipart/form-data"
               hx-target="#import-result"
               onchange="this.closest('form') && this.closest('form').submit()">
      </label>

      <!-- Export -->
      <a href="/api/workflows/export?format=json"
         class="inline-flex items-center rounded-md bg-white dark:bg-gray-800 px-3 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700"
         aria-label="Export all workflows as JSON"
         download>
        <svg class="-ml-0.5 mr-1.5 h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M3 16.5v-13A1.5 1.5 0 014.5 2h7.379a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 01.44 1.061V16.5A1.5 1.5 0 0114 18H4.5A1.5 1.5 0 013 16.5zm4.5-9a.75.75 0 01.75.75v4.19l1.22-1.22a.75.75 0 111.06 1.06l-2.5 2.5a.75.75 0 01-1.06 0l-2.5-2.5a.75.75 0 011.06-1.06l1.22 1.22V8.25A.75.75 0 017.5 7.5z" clip-rule="evenodd" transform="rotate(180,10,10)" />
        </svg>
        Export All
      </a>

      <!-- New Workflow -->
      <a href="/workflows/new"
         class="inline-flex items-center rounded-md bg-primary-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-primary-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-600"
         aria-label="Create a new workflow">
        <svg class="-ml-0.5 mr-1.5 h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z" />
        </svg>
        New Workflow
      </a>
    </div>
  </div>

  <!-- Import result placeholder -->
  <div id="import-result"></div>

  <!-- Filters -->
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border border-gray-200 dark:border-gray-700">
    <div class="flex flex-wrap gap-4">
      <!-- Search -->
      <div class="flex-1 min-w-[200px]">
        <label for="search" class="sr-only">Search workflows</label>
        <div class="relative">
          <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
            <svg class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
            </svg>
          </div>
          <input
            type="search"
            name="q"
            id="search"
            class="block w-full rounded-md border-0 py-1.5 pl-10 text-gray-900 dark:text-white dark:bg-gray-700 ring-1 ring-inset ring-gray-300 dark:ring-gray-600 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-600 sm:text-sm sm:leading-6"
            placeholder="Search workflows..."
            aria-label="Search workflows"
            hx-get="/htmx/workflows"
            hx-trigger="keyup changed delay:300ms"
            hx-target="#workflow-list"
            hx-include="[name='status'],[name='sort']"
            hx-indicator=".htmx-indicator"
          >
        </div>
      </div>

      <!-- Status filter -->
      <div>
        <label for="status-filter" class="sr-only">Filter by status</label>
        <select
          id="status-filter"
          name="status"
          class="block rounded-md border-0 py-1.5 pl-3 pr-10 text-gray-900 dark:text-white dark:bg-gray-700 ring-1 ring-inset ring-gray-300 dark:ring-gray-600 focus:ring-2 focus:ring-primary-600 sm:text-sm sm:leading-6"
          aria-label="Filter by status"
          hx-get="/htmx/workflows"
          hx-trigger="change"
          hx-target="#workflow-list"
          hx-include="[name='q'],[name='sort']"
        >
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="draft">Draft</option>
          <option value="archived">Archived</option>
        </select>
      </div>

      <!-- Sort -->
      <div>
        <label for="sort-select" class="sr-only">Sort workflows</label>
        <select
          id="sort-select"
          name="sort"
          class="block rounded-md border-0 py-1.5 pl-3 pr-10 text-gray-900 dark:text-white dark:bg-gray-700 ring-1 ring-inset ring-gray-300 dark:ring-gray-600 focus:ring-2 focus:ring-primary-600 sm:text-sm sm:leading-6"
          aria-label="Sort workflows"
          hx-get="/htmx/workflows"
          hx-trigger="change"
          hx-target="#workflow-list"
          hx-include="[name='q'],[name='status']"
        >
          <option value="updated">Last Updated</option>
          <option value="name">Name</option>
          <option value="created">Created</option>
          <option value="runs">Most Runs</option>
        </select>
      </div>
    </div>

    <!-- Loading indicator -->
    <div class="htmx-indicator mt-2 text-sm text-gray-500 dark:text-gray-400" aria-live="polite">
      <svg class="animate-spin inline h-4 w-4 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Loading...
    </div>
  </div>

  <!-- Workflow list (populated via HTMX) -->
  <div id="workflow-list"
       hx-get="/htmx/workflows"
       hx-trigger="load"
       hx-swap="innerHTML"
       aria-label="Workflow list"
       aria-live="polite">
    <!-- Loading skeleton -->
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-hidden="true">
      {% for _ in 0..6 %}
      <div class="animate-pulse bg-white dark:bg-gray-800 rounded-lg shadow p-4 border border-gray-200 dark:border-gray-700">
        <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-3/4 mb-3"></div>
        <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-full mb-2"></div>
        <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-2/3"></div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
