{% extends "layouts/base.html" %}
{% block title %}Page Not Found — OxiFY{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
  <div class="text-center" role="main" aria-labelledby="error-heading">
    <div class="text-9xl font-bold text-indigo-200 dark:text-indigo-800 select-none" aria-hidden="true">404</div>
    <h1 id="error-heading" class="mt-4 text-3xl font-bold text-gray-900 dark:text-white">Page not found</h1>
    <p class="mt-2 text-gray-500 dark:text-gray-400">The page you're looking for doesn't exist or has been moved.</p>
    <div class="mt-8 flex gap-4 justify-center">
      <a href="/"
         class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
         aria-label="Go to dashboard">
        Go to dashboard
      </a>
      <button onclick="history.back()"
              class="inline-flex items-center rounded-md bg-white dark:bg-gray-800 px-4 py-2 text-sm font-semibold text-gray-900 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700"
              aria-label="Go back">
        Go back
      </button>
    </div>
  </div>
</div>
{% endblock %}
