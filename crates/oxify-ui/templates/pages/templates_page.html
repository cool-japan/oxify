{% extends "layouts/base.html" %}

{% block title %}{{ title }} - OxiFY{% endblock %}

{% block content %}
<div class="space-y-6" role="main" aria-labelledby="templates-heading">
  <!-- Header -->
  <div class="sm:flex sm:items-center sm:justify-between">
    <div>
      <h1 id="templates-heading" class="text-2xl font-bold text-gray-900 dark:text-white">Template Gallery</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Start a new workflow from a pre-built template</p>
    </div>
    <div class="mt-4 sm:mt-0">
      <a href="/workflows/new"
         class="inline-flex items-center rounded-md bg-white dark:bg-gray-800 px-3 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700"
         aria-label="Create a blank workflow without a template">
        <svg class="-ml-0.5 mr-1.5 h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10.75 4.75a.75.75 0 00-1.5 0v4.5h-4.5a.75.75 0 000 1.5h4.5v4.5a.75.75 0 001.5 0v-4.5h4.5a.75.75 0 000-1.5h-4.5v-4.5z" />
        </svg>
        Blank Workflow
      </a>
    </div>
  </div>

  <!-- Template grid (can be HTMX-refreshed) -->
  <div id="template-grid"
       hx-get="/htmx/templates"
       hx-trigger="load"
       hx-swap="innerHTML"
       aria-label="Template gallery"
       aria-live="polite">
    <!-- Loading skeleton -->
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3" aria-hidden="true">
      {% for _ in 0..6 %}
      <div class="animate-pulse bg-white dark:bg-gray-800 rounded-lg shadow p-5 border border-gray-200 dark:border-gray-700">
        <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mb-2"></div>
        <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/4 mb-4"></div>
        <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-full mb-2"></div>
        <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-5/6 mb-4"></div>
        <div class="h-8 bg-gray-200 dark:bg-gray-700 rounded w-1/3"></div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>

<!-- Template detail slide-over panel -->
<div id="template-detail-panel" class="hidden fixed inset-y-0 right-0 z-50 w-full max-w-md bg-white dark:bg-gray-800 shadow-xl border-l border-gray-200 dark:border-gray-700 overflow-y-auto"
     role="dialog" aria-modal="true" aria-labelledby="template-detail-title">
  <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 dark:border-gray-700">
    <h2 id="template-detail-title" class="text-lg font-semibold text-gray-900 dark:text-white">Template Parameters</h2>
    <button type="button"
            onclick="document.getElementById('template-detail-panel').classList.add('hidden')"
            class="rounded-md text-gray-400 hover:text-gray-500 dark:hover:text-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-500"
            aria-label="Close parameter panel">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  <div id="template-detail-content" class="px-6 py-4">
    <!-- Populated via HTMX -->
  </div>
</div>
{% endblock %}
