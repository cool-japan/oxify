[package]
name = "oxify-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Web UI for OxiFY - Rust + Axum + Askama + HTMX"
repository = "https://github.com/cool-japan/oxify"
categories = ["web-programming::http-server", "gui"]
keywords = ["web-ui", "htmx", "askama", "dashboard", "interface"]

[[bin]]
name = "oxify-ui"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
oxify-model = { version = "0.2.0", path = "../oxify-model" }
oxify-engine = { version = "0.2.0", path = "../oxify-engine" }
oxify-storage = { version = "0.2.0", path = "../oxify-storage" }
oxify-authn = { version = "0.2.0", path = "../oxify-authn" }
oxify-authz = { version = "0.2.0", path = "../oxify-authz" }

# Web framework
axum = { workspace = true, features = ["macros"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace", "fs", "compression-gzip"] }
tokio = { workspace = true }

# Templating
askama = "0.15"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Async utilities
futures = { workspace = true }
tokio-stream = { workspace = true }

# HTTP client
reqwest = { workspace = true, features = ["json"] }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Hot reload (dev only)
tower-livereload = { version = "0.10", optional = true }
notify = { version = "8.2", optional = true }

[features]
default = []
hot-reload = ["tower-livereload", "notify"]

[dev-dependencies]
tokio-test = "0.4"
tower = { workspace = true, features = ["util"] }
hyper = { workspace = true }
http-body-util = "0.1"
