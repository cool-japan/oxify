[package]
name = "oxify-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Model Context Protocol (MCP) server implementation for OxiFY"
repository = "https://github.com/cool-japan/oxify"
categories = ["network-programming", "web-programming", "development-tools"]
keywords = ["mcp", "mcp-server", "context-protocol", "ai"]

[dependencies]
oxify-model = { version = "0.1.0", path = "../oxify-model" }
tokio = { workspace = true, features = ["process", "io-util"] }
async-trait = { workspace = true }
base64 = "0.22"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# Database support (optional)
sqlx = { workspace = true, optional = true }

[features]
default = []
database = ["sqlx"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
