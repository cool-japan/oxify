apiVersion: v1
kind: Secret
metadata:
  name: oxify-secrets
  namespace: oxify
  labels:
    app: oxify-server
type: Opaque
stringData:
  # Database connection
  database-url: "postgres://oxify:CHANGEME@postgres:5432/oxify"

  # Redis connection
  redis-url: "redis://redis:6379"

  # JWT secret (change in production)
  jwt-secret: "CHANGEME-GENERATE-RANDOM-SECRET"

  # TLS certificates (if using TLS)
  # tls-cert: |
  #   -----BEGIN CERTIFICATE-----
  #   ...
  #   -----END CERTIFICATE-----

  # tls-key: |
  #   -----BEGIN PRIVATE KEY-----
  #   ...
  #   -----END PRIVATE KEY-----

# Note: In production, use sealed-secrets or external secret management
# Example with sealed-secrets:
#   kubectl create secret generic oxify-secrets \
#     --from-literal=database-url='postgres://...' \
#     --from-literal=redis-url='redis://...' \
#     --from-literal=jwt-secret='...' \
#     --dry-run=client -o yaml | \
#     kubeseal -o yaml > sealed-secret.yaml
