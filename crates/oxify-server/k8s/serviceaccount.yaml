apiVersion: v1
kind: ServiceAccount
metadata:
  name: oxify-server
  namespace: oxify
  labels:
    app: oxify-server
automountServiceAccountToken: true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oxify-server-role
  namespace: oxify
  labels:
    app: oxify-server
rules:
  # Allow reading ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Allow reading Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # Allow pod listing (for health checks)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oxify-server-rolebinding
  namespace: oxify
  labels:
    app: oxify-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oxify-server-role
subjects:
  - kind: ServiceAccount
    name: oxify-server
    namespace: oxify
