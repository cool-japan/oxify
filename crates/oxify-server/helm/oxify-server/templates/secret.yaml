apiVersion: v1
kind: Secret
metadata:
  name: oxify-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oxify-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  redis-url: {{ .Values.secrets.redisUrl | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
