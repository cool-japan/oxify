[package]
name = "oxify-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Command-line interface for OxiFY AI orchestration and workflow automation"
repository = "https://github.com/cool-japan/oxify"
categories = ["command-line-utilities", "development-tools"]
keywords = ["cli", "ai", "workflow", "automation", "orchestration"]

[[bin]]
name = "oxify-cli"
path = "src/main.rs"

[dependencies]
oxify-model = { version = "0.2.0", path = "../oxify-model" }
oxify-engine = { version = "0.2.0", path = "../oxify-engine" }
oxify-connect-llm = { version = "0.2.0", path = "../oxify-connect-llm" }
oxify-connect-vector = { version = "0.2.0", path = "../oxify-connect-vector" }
oxify-connect-vision = { version = "0.2.0", path = "../oxify-connect-vision" }
clap = { workspace = true }
clap_complete = "4.6"
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
flate2 = "1.1"
tar = "0.4"
oxiarc-archive = "0.2.8"
uuid = { workspace = true }
chrono = { workspace = true }
rpassword = "7.4"
ratatui = { workspace = true }
crossterm = { workspace = true }
