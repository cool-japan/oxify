[package]
name = "oxify-authn"
version = "0.2.0"
edition = "2021"
rust-version.workspace = true
authors = ["OxiFY Contributors"]
license = "Apache-2.0"
description = "Authentication module for OxiFY - JWT, OAuth2, SAML, LDAP support (ported from OxiRS)"
repository = "https://github.com/cool-japan/oxify"
categories = ["authentication", "web-programming", "cryptography"]
keywords = ["jwt", "oauth2", "saml", "ldap", "authentication"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

# Authentication
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
oauth2 = "5.0"
oxihttp = { workspace = true }

# Password hashing
# COOLJAPAN pure-Rust Argon2id KDF (replaces the legacy `argon2` 0.5 crate; password.rs migrated)
oxicrypto-kdf = { version = "0.3.0", features = ["std"] }
oxicrypto-core = { version = "0.3.0", features = ["std"] }
bcrypt = "0.19"

# TOTP for MFA (optional)
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth"], optional = true }

# Random number generation
rand = { workspace = true }

# Base64 encoding
base64 = "0.22"

# UUID generation
uuid = { workspace = true }

# URL encoding
percent-encoding = "2.3"

# SHA256 for PKCE
oxicrypto-hash = { workspace = true }
hex = { workspace = true }

# SAML 2.0 support (optional)
quick-xml = { version = "0.41", features = ["serialize"], optional = true }
oxiarc-deflate = { workspace = true, optional = true }
url = { version = "2.5", optional = true }

# LDAP support (optional)
ldap3 = { version = "0.12", optional = true }

# WebAuthn/FIDO2 support (optional)
webauthn-rs = { version = "0.5", optional = true }
webauthn-rs-proto = { version = "0.5", optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = { workspace = true }

[[bench]]
name = "auth_benchmarks"
harness = false
required-features = ["session", "ratelimit", "apikey", "metrics"]

[features]
default = ["jwt", "oauth", "password"]
jwt = []
oauth = []
saml = ["quick-xml", "oxiarc-deflate", "url"]
ldap = ["ldap3"]
password = []
mfa = ["totp-rs"]
session = []
revocation = []
ratelimit = []
webauthn = ["webauthn-rs", "webauthn-rs-proto", "url"]
risk = []
rotation = []
apikey = []
metrics = []
cert = []
idp = ["oauth"]
ai = []
