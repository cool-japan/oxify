[package]
name = "oxify-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Data models and types for OxiFY workflows, execution, and configuration"
repository = "https://github.com/cool-japan/oxify"
categories = ["data-structures", "encoding", "config"]
keywords = ["models", "workflow", "serialization", "types"]

# `cdylib` is what `wasm-pack build --features wasm` (and any pyo3
# extension-module build of the `python` feature) requires: without it wasm-pack
# refuses the crate outright — "crate-type must be cdylib to compile to
# wasm32-unknown-unknown" — which is why the wasm-bindgen surface in `src/wasm.rs`
# had never actually been through wasm-bindgen codegen. `rlib` is kept alongside
# it so every in-workspace dependant, the doc tests and the benches still link
# against this crate as a normal Rust library.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
utoipa = { version = "5.5.0", features = ["uuid", "chrono"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
ts-rs = { version = "12.0", optional = true }
oxicrypto-mac = { workspace = true }
hex = "0.4"
rand = { workspace = true }
regex = "1.12"
percent-encoding = { workspace = true }

# Python bindings - only on Linux where extension-module can be properly tested
# On macOS/Windows, pyo3 extension-module requires special build setup
[target.'cfg(target_os = "linux")'.dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"], optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }

[[bench]]
name = "workflow_benchmarks"
harness = false

[features]
default = []
openapi = ["utoipa"]
# python feature only has effect on Linux (pyo3 is target-gated)
python = ["pyo3"]
wasm = ["wasm-bindgen"]
typescript = ["ts-rs"]

# wasm32-unknown-unknown (the wasm-bindgen / wasm-pack target the `wasm` feature
# exists for) has no OS entropy source, and both of these crates refuse to
# compile there until a direct dependent names the JavaScript backend. Neither
# is called from oxify-model code: `getrandom` arrives through `rand`, `uuid` is
# re-declared only to add its `js` feature on this target. Target-gated, so no
# host build sees them.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true }
uuid = { workspace = true }
