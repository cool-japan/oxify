[package]
name = "oxify-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SQLite-based storage layer for OxiFY execution history, metrics, and caching"
repository = "https://github.com/cool-japan/oxify"
categories = ["database", "caching", "asynchronous"]
keywords = ["sqlite", "database", "storage", "metrics", "cache"]

[dependencies]
oxify-model = { version = "0.2.0", path = "../oxify-model" }
sqlx = { workspace = true, features = ["migrate", "json", "uuid", "chrono", "rust_decimal"] }
rust_decimal = "1.42"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
aes-gcm = "0.10"
pbkdf2 = { version = "0.13", features = ["hmac"] }
sha2 = "0.11"
rand = { workspace = true }
base64 = "0.22"
regex = "1.12"
hmac = "0.13"
hex = "0.4"
reqwest = { workspace = true }
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
default = []
redis-cache = ["redis"]

[dev-dependencies]
tokio-test = "0.4"
