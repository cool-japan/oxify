[package]
name = "oxify-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "SQLite-based storage layer for OxiFY execution history, metrics, and caching"
repository = "https://github.com/cool-japan/oxify"
categories = ["database", "caching", "asynchronous"]
keywords = ["sqlite", "database", "storage", "metrics", "cache"]

[dependencies]
oxify-model = { version = "0.2.0", path = "../oxify-model" }
oxisql-core = { workspace = true }
oxisql-sqlite-compat = { workspace = true }
oxisql-pool = { workspace = true }
oxisql-migrate = { workspace = true }
deadpool = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
aes-gcm = "0.11"
pbkdf2 = { version = "0.13", features = ["hmac"] }
sha2 = { workspace = true }
oxicrypto-hash = { workspace = true }
oxicrypto-mac = { workspace = true }
oxicrypto-core = { workspace = true }
rand = { workspace = true }
base64 = "0.22"
regex = "1.12"
hex = "0.4"
oxihttp = { workspace = true }
redis = { version = "1.3", features = ["tokio-comp", "connection-manager"], optional = true }

[features]
default = []
redis-cache = ["redis"]

[dev-dependencies]
tokio-test = "0.4"
