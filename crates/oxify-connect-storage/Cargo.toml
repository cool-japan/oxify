[package]
name = "oxify-connect-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Object storage connectors for OxiFY - S3, MinIO, GCS, Azure Blob"
repository = "https://github.com/cool-japan/oxify"

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
chrono.workspace = true
bytes.workspace = true
oxistore-blob       = { workspace = true, optional = true }
oxistore-blob-s3    = { workspace = true, optional = true }
oxistore-blob-gcs   = { workspace = true, optional = true }
oxistore-blob-azure = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true

[features]
default = ["memory"]
memory = []
aws = ["oxistore-blob", "oxistore-blob-s3"]
gcs = ["oxistore-blob", "oxistore-blob-gcs"]
azure = ["oxistore-blob", "oxistore-blob-azure"]
local = ["oxistore-blob"]
all-providers = ["memory", "aws", "gcs", "azure", "local"]
