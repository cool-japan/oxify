[package]
name = "oxify-celers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bridge OxiFY workflow execution to the CeleRS distributed task queue"

[dependencies]
oxify-model  = { version = "0.2.0", path = "../oxify-model" }
oxify-engine = { version = "0.2.0", path = "../oxify-engine" }

# CeleRS facade — cross-workspace path dep; NOT published on crates.io.
# default-features=false: we control which sub-features to activate.
celers = { workspace = true, optional = true }

# celers-core provides Task, TaskRegistry, TaskId, CelersError, BrokerMessage
# which the celers facade does not re-export.
celers-core = { path = "../../../celers/crates/celers-core", version = "0.2.0", optional = true }

serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[features]
default = []
# Pulls CeleRS facade with Redis broker + Redis result backend.
redis    = ["dep:celers", "dep:celers-core", "celers/redis", "celers/backend-redis", "celers/json"]
# Adds the worker bootstrap helper (needs redis to be useful).
worker   = ["redis"]
# MockBroker/MockResultStore for hermetic tests.
test-utils = ["dep:celers", "dep:celers-core", "celers/dev-utils", "celers/json", "celers/redis"]
