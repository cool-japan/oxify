[package]
name = "oxify-connect-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Database connectors for OxiFY - PostgreSQL, MySQL, MongoDB"
repository = "https://github.com/cool-japan/oxify"
categories = ["database", "api-bindings", "asynchronous"]
keywords = ["database", "postgresql", "mysql", "mongodb", "sqlx"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
chrono.workspace = true
futures.workspace = true
sqlx = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile.workspace = true

[features]
default = []
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
mongodb-store = ["dep:mongodb"]
all-backends = ["postgres", "mysql", "mongodb-store"]
