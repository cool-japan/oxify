apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oxify-api-hpa
  namespace: oxify
  labels:
    app: oxify-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oxify-api

  minReplicas: 3
  maxReplicas: 10

  metrics:
    # CPU utilization target
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Memory utilization target
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min

    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max
