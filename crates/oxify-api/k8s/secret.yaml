apiVersion: v1
kind: Secret
metadata:
  name: oxify-api-secret
  namespace: oxify
  labels:
    app: oxify-api
type: Opaque
stringData:
  # JWT secret key - MUST be changed in production!
  JWT_SECRET: "your-production-secret-key-change-this"

  # Database password - MUST be changed in production!
  DATABASE_PASSWORD: "your-database-password"

  # Redis password - MUST be changed in production!
  REDIS_PASSWORD: "your-redis-password"

  # API keys for external services (if needed)
  # OPENAI_API_KEY: "sk-..."
  # ANTHROPIC_API_KEY: "..."
