---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oxify-config
  namespace: oxify-system
  labels:
    app.kubernetes.io/name: oxify
    app.kubernetes.io/component: config
data:
  # Logging
  RUST_LOG: "info,oxify_ui=info,tower_http=info"

  # Server binding
  OXIFY_UI_HOST: "0.0.0.0"
  OXIFY_UI_PORT: "3000"
  OXIFY_UI_USE_MOCK: "false"

  # Database connection pool
  DB_MAX_CONNECTIONS: "10"
  DB_MIN_CONNECTIONS: "2"
  DB_CONNECT_TIMEOUT_SECS: "30"

  # Qdrant Vector Database
  QDRANT_URL: "http://qdrant.oxify-system.svc.cluster.local:6333"

  # Redis cache
  REDIS_URL: "redis://redis.oxify-system.svc.cluster.local:6379"

  # API backend (oxify-server if deployed separately)
  OXIFY_API_BASE_URL: "http://oxify-server.oxify-system.svc.cluster.local:8080"

  # OpenTelemetry tracing
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.oxify-system.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "oxify-ui"
  OTEL_RESOURCE_ATTRIBUTES: "service.version=0.2.8,deployment.environment=production"

  # Application settings
  OXIFY_WORKER_THREADS: "4"
  OXIFY_MAX_WORKFLOW_CONCURRENCY: "64"
  OXIFY_EXECUTION_TIMEOUT_SECS: "3600"
