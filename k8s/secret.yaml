---
# OxiFY Secret template
#
# IMPORTANT: Do NOT commit real values to version control.
# Before applying, populate each value with its base64-encoded secret:
#
#   echo -n "your-value-here" | base64
#
# Alternatively, use a secrets manager (e.g., Sealed Secrets, External Secrets
# Operator, HashiCorp Vault) and remove this file from the repository.
#
# Environment variables provided by this secret:
#   DATABASE_URL      — PostgreSQL connection string
#                       e.g. postgres://oxify:password@postgres:5432/oxify
#   REDIS_URL         — Redis connection URL
#                       e.g. redis://:password@redis:6379
#   JWT_SECRET        — HS256/HS512 signing key for session tokens (min 32 chars)
#   GITHUB_TOKEN      — GitHub personal access token for MCP GitHub integration
#   OPENAI_API_KEY    — OpenAI API key for LLM connector
#   ANTHROPIC_API_KEY — Anthropic API key for LLM connector

apiVersion: v1
kind: Secret
metadata:
  name: oxify-secret
  namespace: oxify-system
  labels:
    app.kubernetes.io/name: oxify
    app.kubernetes.io/component: secret
type: Opaque
data:
  # base64-encoded values — replace with real secrets before deploying
  DATABASE_URL: ""       # echo -n "postgres://oxify:CHANGE_ME@postgres:5432/oxify" | base64
  REDIS_URL: ""          # echo -n "redis://:CHANGE_ME@redis:6379" | base64
  JWT_SECRET: ""         # echo -n "CHANGE_ME_min_32_chars_random_string" | base64
  GITHUB_TOKEN: ""       # echo -n "ghp_CHANGE_ME" | base64
  OPENAI_API_KEY: ""     # echo -n "sk-CHANGE_ME" | base64
  ANTHROPIC_API_KEY: ""  # echo -n "sk-ant-CHANGE_ME" | base64
