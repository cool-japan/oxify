---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxify-ui
  namespace: oxify-system
  labels:
    app.kubernetes.io/name: oxify
    app.kubernetes.io/component: ui
    app.kubernetes.io/version: "0.2.8"
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oxify
      app.kubernetes.io/component: ui
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Allow in-flight requests to complete before pod is terminated
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxify
        app.kubernetes.io/component: ui
        app.kubernetes.io/version: "0.2.8"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # -----------------------------------------------------------------------
      # Security hardening
      # -----------------------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      serviceAccountName: oxify-ui

      terminationGracePeriodSeconds: 60

      # -----------------------------------------------------------------------
      # Topology spread — distribute pods across availability zones
      # -----------------------------------------------------------------------
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: oxify
              app.kubernetes.io/component: ui
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: oxify
              app.kubernetes.io/component: ui

      # -----------------------------------------------------------------------
      # Affinity: prefer to run on different nodes
      # -----------------------------------------------------------------------
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: oxify
                    app.kubernetes.io/component: ui
                topologyKey: kubernetes.io/hostname

      containers:
        - name: oxify-ui
          # Replace ${REGISTRY} and ${TAG} via envsubst or Kustomize before applying
          image: "${REGISTRY}/oxify-ui:${TAG}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # ------------------------------------------------------------------
          # Security context (container-level)
          # ------------------------------------------------------------------
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          # ------------------------------------------------------------------
          # Resource allocation
          # ------------------------------------------------------------------
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

          # ------------------------------------------------------------------
          # Health probes
          # The UI server does not currently register /health or /readyz routes
          # out of the box; add them to routes.rs before deploying to k8s.
          # Until then, the probes target the dashboard root (/) as a fallback.
          # ------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # ------------------------------------------------------------------
          # Configuration injection
          # ------------------------------------------------------------------
          envFrom:
            - configMapRef:
                name: oxify-config
            - secretRef:
                name: oxify-secret

          # ------------------------------------------------------------------
          # Writable directories required despite readOnlyRootFilesystem
          # ------------------------------------------------------------------
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-tmp
              mountPath: /app/tmp
            - name: cache
              mountPath: /app/cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 512Mi
