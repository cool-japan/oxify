[package]
name = "oxify-complete-server"
version = "0.2.0"
edition = "2021"
publish = false

[workspace]
# This is a standalone example, not part of the parent workspace

[[bin]]
name = "server"
path = "main.rs"

[dependencies]
# OxiFY crates
oxify-server = { path = "../../crates/api/oxify-server" }
oxify-authn = { path = "../../crates/security/oxify-authn" }
oxify-authz = { path = "../../crates/security/oxify-authz" }
oxify-vector = { path = "../../crates/engine/oxify-vector" }

# External dependencies
tokio = { version = "1.48", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["compression", "cors"]
compression = ["oxify-server/compression"]
cors = ["oxify-server/cors"]
