---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxify.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oxify.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "oxify.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

---
# Headless service for direct pod addressing (service mesh / gRPC / internal DNS)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxify.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oxify.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "oxify.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.targetPort }}
      targetPort: {{ .Values.service.targetPort }}
