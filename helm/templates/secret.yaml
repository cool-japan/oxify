---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oxify.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oxify.labels" . | nindent 4 }}
  annotations:
    # helm.sh/resource-policy: keep ensures the secret is NOT deleted on
    # `helm uninstall` — protects credentials from accidental removal.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
